      margin: 0;

    /* Figma Panel Card style */
    .neuro-flat {
      background-color: var(--white);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-figma);
      border-radius: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);

      transform: translateY(-1.5px);
    }

    /* Inset panel for containers */
    .neuro-inset {
      background-color: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
    }

    /* Toolbar button styling */
    .neuro-button {
      background-color: var(--white);
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      color: #334155;
      font-weight: 500;
      box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .neuro-button:hover {
      border-color: #CBD5E1;
      background-color: #F8FAFC;
      color: var(--blue-main);
      transform: translateY(-0.5px);
    }

    .neuro-button:active {
      background-color: #F1F5F9;
      transform: translateY(0.5px);
      box-shadow: inset 0 1px 2px 0 rgba(15, 23, 42, 0.05);
    }

    /* Minimalist Figma-styled glass pills & badges */
    .glass {
      background-color: var(--white);
      border: 1px solid #E2E8F0;
      border-radius: 9999px;
      box-shadow: var(--shadow-figma);
    }

    .glass-pill {
      background-color: var(--blue-light);
      border: 1px solid #DBEAFE;
      color: #1E40AF;
      border-radius: 9999px;
      font-weight: 600;
    }

    /* Scrollbar styling for high-density feel */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(37, 99, 235, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(37, 99, 235, 0.3);
    }

    /* Animations */
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-pulse-soft {
      animation: pulse-soft 2s infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97) translateY(4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    // --- Minimal JS-Confetti Generator for Acode Preview ---
    function triggerConfettiAnimation() {
      const duration = 1.5 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 25, spread: 360, ticks: 50, zIndex: 10000 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        const particleCount = 20 * (timeLeft / duration);
        // Create random confetti pieces directly inside HTML body
        for (let i = 0; i < particleCount; i++) {
          const div = document.createElement('div');
          div.style.position = 'fixed';
          div.style.zIndex = '9999';
          div.style.width = '8px';
          div.style.height = '8px';
          div.style.backgroundColor = ['#2563EB', '#10B981', '#F59E0B', '#EF4444', '#EC4899'][Math.floor(Math.random() * 5)];
          div.style.left = randomInRange(10, 90) + '%';
          div.style.top = randomInRange(0, 50) + '%';
          div.style.opacity = Math.random();
          div.style.transform = `rotate(${randomInRange(0, 360)}deg)`;
          div.style.pointerEvents = 'none';
          div.style.transition = 'all 1.5s ease-out';
          document.body.appendChild(div);

          setTimeout(() => {
            div.style.top = (parseInt(div.style.top) + 40) + '%';
            div.style.opacity = '0';
            setTimeout(() => div.remove(), 1500);
          }, 50);
        }
      }, 150);
    }

      const [isChatLoading, setIsChatLoading] = useState(false);
      const chatEndRef = useRef(null);

      // Save States
      useEffect(() => {
        localStorage.setItem('english_on_the_go_score', score.toString());
      }, [score]);

      useEffect(() => {
        localStorage.setItem('english_on_the_go_progress', JSON.stringify(completedQuizzes));
      }, [completedQuizzes]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages]);

      // Calculations
      const completedCount = Object.keys(completedQuizzes).reduce((acc, key) => {
        return acc + (completedQuizzes[key]?.length || 0);
      }, 0);
      const progressPercentage = Math.round((completedCount / 36) * 100);

      const getSectionMastery = (sectionId) => {
        const completed = completedQuizzes[sectionId]?.length || 0;
        return Math.round((completed / 6) * 100);
      };

      // --- Offline AI Simulation Responses ---
      const simulateTutorResponse = (query) => {
        const text = query.toLowerCase();
        let response = "I received your message! Let's practice English grammar together.";
        
        if (text.includes('present') || text.includes('routine')) {
          response = "Regarding the Simple Present: We use it for habits and general truths! Third-person singular subjects (he/she/it) add -s or -es (e.g., 'He speaks English'). For questions/negatives, we use 'do' or 'does'.";
        } else if (text.includes('past') || text.includes('yesterday')) {
          response = "Regarding the Simple Past: We use it for completed past actions! Regular verbs add '-ed' (e.g. 'walk' -> 'walked'). Irregular verbs change completely (e.g. 'see' -> 'saw', 'buy' -> 'bought').";
        } else if (text.includes('future') || text.includes('tomorrow')) {
          response = "Regarding the Future: Use 'will' for predictions and instant decisions (e.g., 'I will help you'). Use 'be going to' for planned actions and clear intentions (e.g., 'We are going to study').";
        } else if (text.includes('synonym')) {
          response = "Synonyms are words with similar meanings! For example: 'concise' and 'brief', 'smart' and 'intelligent', 'genuine' and 'authentic'. This helps improve your vocabulary!";
        } else if (text.includes('antonym') || text.includes('opposite')) {
          response = "Antonyms are words with opposite meanings! For example: 'abundant' vs 'scarce', 'joy' vs 'sorrow', 'feeble' vs 'strong'.";
        } else if (text.includes('crossword') || text.includes('clue')) {
          response = "I can help with crosswords! For example, 'SIT' is a down clue for taking a seat, and 'WROTE' is the past of write. What else can I solve for you?";
        }
        return response;
      };

      const handleSendMessage = (e) => {
        if (e) e.preventDefault();
        if (!chatInput.trim() || isChatLoading) return;

        const userText = chatInput;
        setChatInput('');
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        setChatMessages(prev => [...prev, { role: 'user', text: userText, time: timeStr }]);
        setIsChatLoading(true);

        setTimeout(() => {
          const tutorReply = simulateTutorResponse(userText);
          setChatMessages(prev => [...prev, {
            role: 'model',
            text: tutorReply,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }]);
          setIsChatLoading(false);
        }, 800);
      };

      // --- Start a Quiz ---
      const handleStartQuiz = (sectionId, index) => {
        const quizzes = DEFAULT_QUIZZES[sectionId] || [];
        const selectedQuiz = quizzes[index % quizzes.length];
        
        if (selectedQuiz) {
          setQuizTitle(selectedQuiz.title);
          setQuizQuestions(selectedQuiz.questions);
          setCurrentQuestionIndex(0);
          setSelectedOption(null);
          setIsAnswered(false);
          setQuizCorrectAnswersCount(0);
          setIsQuizFinished(false);
          setSelectedQuizIndex(index);
        } else {
          // Generate a custom dummy quiz for practice
          const generatedQuiz = {
            title: `Grammar Practice (Level ${index + 1})`,
            questions: [
              { question: "Choose the correct word: They _______ to school daily.", options: ["go", "goes", "going", "went"], answerIndex: 0, explanation: "We use base verb 'go' for plural subjects." },
              { question: "Select the opposite of 'joy':", options: ["happiness", "sadness", "smile", "delight"], answerIndex: 1, explanation: "Sadness is the direct antonym of joy." }
            ]
          };
          setQuizTitle(generatedQuiz.title);
          setQuizQuestions(generatedQuiz.questions);
          setCurrentQuestionIndex(0);
          setSelectedOption(null);
          setIsAnswered(false);
          setQuizCorrectAnswersCount(0);
          setIsQuizFinished(false);
          setSelectedQuizIndex(index);
        }
      };

      // --- Answer a Quiz Question ---
      const handleSelectOption = (idx) => {
        if (isAnswered) return;
        setSelectedOption(idx);
        setIsAnswered(true);
        const isCorrect = idx === quizQuestions[currentQuestionIndex].answerIndex;
        if (isCorrect) {
          setQuizCorrectAnswersCount(prev => prev + 1);
          setScore(prev => prev + 50);
        }
      };

      // --- Next Question ---
      const handleNextQuestion = () => {
        if (currentQuestionIndex + 1 < quizQuestions.length) {
          setCurrentQuestionIndex(prev => prev + 1);
          setSelectedOption(null);
          setIsAnswered(false);
        } else {
          setIsQuizFinished(true);
          // Mark as completed
          setCompletedQuizzes(prev => {
            const updated = { ...prev };
            if (!updated[selectedSection]) updated[selectedSection] = [];
            if (!updated[selectedSection].includes(selectedQuizIndex)) {
              updated[selectedSection] = [...updated[selectedSection], selectedQuizIndex];
            }
            return updated;
          });
          setScore(prev => prev + 150);
          triggerConfettiAnimation();
          setAppAlert({
            show: true,
            title: "Quiz Completed!",
            message: `🎉 You completed "${quizTitle}" with ${quizCorrectAnswersCount + 1}/${quizQuestions.length} correct answers! Earned +150 Completion Bonus!`,
            type: 'success'
          });
        }
      };

      // --- Load Crossword Puzzle ---
      const handleStartCrossword = (index) => {
        const crossword = DEFAULT_CROSSWORDS[index % DEFAULT_CROSSWORDS.length];
        setCrosswordData(crossword);
        setSelectedQuizIndex(index);

        // Build blank grid
        const grid = Array(crossword.size).fill(null).map(() => Array(crossword.size).fill(''));
        setUserGrid(grid);
        setSelectedCell(null);
        setCrosswordChecked(false);
        setActiveClueText('Select an active letter cell (white) to see a clue');
      };

      // --- Edit Cell inside Crossword ---
      const handleCellInput = (r, c, val) => {
        const cleanVal = val.slice(-1).toUpperCase();
        setUserGrid(prev => {
          const next = prev.map(row => [...row]);
          next[r][c] = cleanVal;
          return next;
        });

        // Auto move to next cell in current direction
        if (cleanVal && selectedCell) {
          const activeClues = crosswordData.clues.filter(cl => {
            if (selectedDirection === 'across') {
              return r === cl.row && c >= cl.col && c < cl.col + cl.answer.length;
            } else {
              return c === cl.col && r >= cl.row && r < cl.row + cl.answer.length;
            }
          });

          if (activeClues.length > 0) {
            const clue = activeClues[0];
            const length = clue.answer.length;
            const currentOffset = selectedDirection === 'across' ? c - clue.col : r - clue.row;
            if (currentOffset < length - 1) {
              setSelectedCell({
                r: selectedDirection === 'across' ? r : r + 1,
                c: selectedDirection === 'across' ? c + 1 : c
              });
            }
          }
        }
      };

      // Check Crossword Status
      const handleCheckCrossword = () => {
        if (!crosswordData) return;
        let countCorrect = 0;
        let countTotalCells = 0;
        let solved = true;

        crosswordData.clues.forEach(clue => {
          const isAcross = clue.direction === 'across';
          for (let i = 0; i < clue.answer.length; i++) {
            const r = isAcross ? clue.row : clue.row + i;
            const c = isAcross ? clue.col + i : clue.col;
            const userLetter = userGrid[r]?.[c] || '';
            const correctLetter = clue.answer[i];

            if (userLetter === correctLetter) {
              countCorrect++;
            } else {
              solved = false;
            }
            countTotalCells++;
          }
        });

        setCrosswordChecked(true);

        if (solved) {
          setScore(prev => prev + 500);
          setCompletedQuizzes(prev => {
            const updated = { ...prev };
            if (!updated.games) updated.games = [];
            if (!updated.games.includes(selectedQuizIndex)) {
              updated.games = [...updated.games, selectedQuizIndex];
            }
            return updated;
          });
          triggerConfettiAnimation();
          setAppAlert({
            show: true,
            title: "Crossword Mastered!",
            message: `🎉 Perfect! You solved "${crosswordData.title}"! Earned +500 Score bonus!`,
            type: 'success'
          });
        } else {
          const percent = Math.round((countCorrect / countTotalCells) * 100);
          setAppAlert({
            show: true,
            title: "Keep Going!",
            message: `You've filled ${countCorrect} out of ${countTotalCells} correct characters (${percent}%). Incorrect cells are highlighted in red!`,
            type: 'info'
          });
        }
      };

      return (
        <div className="min-h-screen pb-16 flex flex-col relative px-4 md:px-8 max-w-6xl mx-auto">
          
          {/* Header Stats Panel */}
          <header className="py-6 flex flex-col md:flex-row items-center justify-between gap-4 border-b border-slate-300/40 mb-6">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white font-extrabold text-lg shadow-md animate-bounce">
                🎓
              </div>
              <div>
                <h1 className="text-xl font-black text-slate-800 font-display">English on the Go!</h1>
                <p className="text-xs text-slate-500 font-semibold">Mr.Zaafouri Labs (Acode Port)</p>
              </div>
            </div>

            {/* Scoreboard and Server Status */}
            <div className="flex items-center gap-4">
              <div className="neuro-flat px-5 py-2 flex items-center gap-2">
                <Trophy size={16} className="text-amber-500" />
                <span className="text-sm font-black text-slate-700">{score} XP</span>
              </div>
              <div className="neuro-flat px-4 py-2 flex items-center gap-2">
                <Wifi size={14} className="text-emerald-500" />
                <span className="text-xs font-black text-slate-600">OFFLINE READY</span>
              </div>
            </div>
          </header>

          {/* Navigation Path Breadcrumbs */}
          {selectedSection && (
            <button 
              onClick={() => {
                setSelectedSection(null);
                setSelectedQuizIndex(null);
                setCrosswordData(null);
              }}
              className="neuro-button self-start mb-6 px-4 py-2 flex items-center gap-2 text-slate-700 hover:text-blue-600 text-xs font-bold"
            >
              <ArrowLeft size={16} /> Back to Dashboard
            </button>
          )}

          {/* Core Content Area */}
          <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            {/* Left Main Panels (Dashboard or Active Workspace) */}
            <div className="lg:col-span-8 flex flex-col gap-6">
              {!selectedSection ? (
                // Dashboard View
                <div className="flex flex-col gap-6 animate-fade-in">
                  
                  {/* Progress Bento Box */}
                  <section className="neuro-flat p-6 grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                    <div className="md:col-span-7">
                      <span className="text-xs font-extrabold text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-wider">Course Status</span>
                      <h2 className="text-2xl font-black text-slate-800 mt-2 font-display">Your Grammar Mastery</h2>
                      <p className="text-sm text-slate-500 mt-1">Unlock certificates and claim bonuses as you finish all 36 levels.</p>
                      
                      {/* Interactive Progress Indicators */}
                      <div className="mt-4 flex items-center gap-3">
                        <div className="flex-1 bg-slate-200 h-3 rounded-full overflow-hidden">
                          <div 
                            className="bg-blue-600 h-full rounded-full transition-all duration-500" 
                            style={{ width: `${progressPercentage}%` }}
                          />
                        </div>
                        <span className="text-sm font-black text-slate-700">{progressPercentage}%</span>
                      </div>
                    </div>
                    <div className="md:col-span-5 flex flex-col gap-2 p-4 bg-slate-100/50 rounded-2xl neuro-inset border border-white/60">
                      <div className="flex justify-between text-xs font-bold text-slate-600">
                        <span>Completed Quizzes:</span>
                        <span className="text-blue-600">{completedCount} / 36</span>
                      </div>
                      <div className="flex justify-between text-xs font-bold text-slate-600">
                        <span>Unlocked Badges:</span>
                        <span className="text-emerald-600">{Math.floor(completedCount/3)} Badges</span>
                      </div>
                    </div>
                  </section>

                  {/* Course Syllabus Grid */}
                  <h3 className="text-lg font-black text-slate-800 font-display">Course Syllabus</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    {QUIZ_SECTIONS.map((sec) => {
                      const mastery = getSectionMastery(sec.id);
                      return (
                        <div 
                          key={sec.id}
                          onClick={() => {
                            setSelectedSection(sec.id);
                            setSelectedQuizIndex(null);
                          }}
                          className="neuro-flat p-5 flex flex-col justify-between cursor-pointer neuro-flat-hover h-44"
                        >
                          <div className="flex justify-between items-start">
                            <span className="text-4xl">{sec.icon}</span>
                            <span className="text-xs font-black bg-blue-50 text-blue-600 px-2 py-1 rounded-md">
                              {mastery}% Mastery
                            </span>
                          </div>
                          <div>
                            <h4 className="text-md font-extrabold text-slate-800 mt-3">{sec.title}</h4>
                            <p className="text-xs text-slate-400 font-semibold mt-1">{sec.count}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                </div>
              ) : selectedQuizIndex === null ? (
                // Section Dashboard & Level List
                <div className="flex flex-col gap-6 animate-fade-in">
                  
                  {/* Neumorphic Grammar Reference Card */}
                  {GRAMMAR_DECKS[selectedSection] && (
                    <section className="neuro-flat p-6 relative overflow-hidden">
                      <span className="absolute -right-6 -top-6 text-9xl opacity-10">📖</span>
                      <h3 className="text-xl font-black text-slate-800 font-display">
                        {GRAMMAR_DECKS[selectedSection].title}
                      </h3>
                      <p className="text-sm text-slate-600 mt-2 leading-relaxed">
                        {GRAMMAR_DECKS[selectedSection].rule}
                      </p>

                      {/* Incorrect/Correct Sentences */}
                      <div className="mt-4 flex flex-col gap-3">
                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wide">Key Examples:</h4>
                        {GRAMMAR_DECKS[selectedSection].examples.map((ex, i) => (
                          <div key={i} className="p-3 bg-white/60 rounded-xl border border-slate-100 flex flex-col gap-1 shadow-sm">
                            <div className="flex items-center gap-2 text-red-500 font-bold text-xs line-through">
                              <X size={14} /> {ex.original}
                            </div>
                            <div className="flex items-center gap-2 text-emerald-600 font-black text-xs">
                              <Check size={14} /> {ex.fixed}
                            </div>
                            <p className="text-[11px] text-slate-400 mt-1 italic pl-6">{ex.tip}</p>
                          </div>
                        ))}
                      </div>
                    </section>
                  )}

                  {/* Level Selection Header */}
                  <div>
                    <h3 className="text-lg font-black text-slate-800 font-display">Choose a level:</h3>
                    <p className="text-xs text-slate-400">Complete each levels to maximize your XP scores.</p>
                  </div>

                  {/* 6 Levels List */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {Array.from({ length: 6 }).map((_, idx) => {
                      const isCompleted = completedQuizzes[selectedSection]?.includes(idx);
                      const isGameMode = selectedSection === 'games';
                      return (
                        <div 
                          key={idx}
                          onClick={() => {
                            if (isGameMode) {
                              handleStartCrossword(idx);
                            } else {
                              handleStartQuiz(selectedSection, idx);
                            }
                          }}
                          className={`p-4 flex items-center justify-between cursor-pointer neuro-flat neuro-flat-hover ${
                            isCompleted ? 'border-l-4 border-emerald-500' : ''
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold text-sm ${
                              isCompleted ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-blue-600'
                            }`}>
                              {idx + 1}
                            </div>
                            <div>
                              <h4 className="text-xs font-extrabold text-slate-800">
                                {isGameMode ? `Crossword Puzzle #${idx + 1}` : `Grammar Level #${idx + 1}`}
                              </h4>
                              <p className="text-[10px] text-slate-400 font-semibold mt-0.5">
                                {isCompleted ? 'Passed (+150 XP Claimed)' : 'Play and earn +150 XP'}
                              </p>
                            </div>
                          </div>
                          <div className="w-8 h-8 rounded-full bg-slate-200/50 flex items-center justify-center text-slate-400">
                            {isCompleted ? <Check size={16} className="text-emerald-500" /> : <Play size={12} className="text-blue-600" />}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                </div>
              ) : selectedSection === 'games' ? (
                // --- Crossword Puzzle Workspace ---
                <div className="flex flex-col gap-6 animate-fade-in">
                  
                  {/* Crossword Header */}
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-300/30 pb-4">
                    <div>
                      <h3 className="text-lg font-black text-slate-800 font-display">{crosswordData?.title}</h3>
                      <p className="text-xs text-slate-400">Tap cells and use your keyboards to solve clues!</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button 
                        onClick={() => handleStartCrossword(selectedQuizIndex)}
                        className="neuro-button px-3 py-1.5 text-slate-600 flex items-center gap-1.5 text-xs font-extrabold"
                      >
                        <RefreshCw size={12} /> Reset
                      </button>
                      <button 
                        onClick={handleCheckCrossword}
                        className="neuro-button px-4 py-1.5 bg-blue-600 text-white flex items-center gap-1.5 text-xs font-extrabold shadow-sm"
                      >
                        <CheckSquare size={12} /> Submit Grid
                      </button>
                    </div>
                  </div>

                  {/* Active Selected Clue Banner */}
                  <div className="p-3 bg-blue-50 border border-blue-100 rounded-xl flex items-start gap-2.5 shadow-sm">
                    <Sparkles size={16} className="text-blue-600 mt-0.5" />
                    <div>
                      <span className="text-[10px] font-black text-blue-600 uppercase tracking-widest block">Active Clue:</span>
                      <p className="text-xs text-slate-700 font-bold">{activeClueText}</p>
                    </div>
                  </div>

                  {/* Crossword Layout */}
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
                    
                    {/* The 8x8 Interactive Grid */}
                    <div className="md:col-span-7 flex justify-center">
                      <div 
                        className="grid gap-1 bg-slate-300 p-2 rounded-2xl shadow-inner border border-slate-400/20"
                        style={{ gridTemplateColumns: `repeat(${crosswordData?.size}, minmax(0, 1fr))` }}
                      >
                        {Array.from({ length: crosswordData?.size || 0 }).map((_, r) => (
                          Array.from({ length: crosswordData?.size || 0 }).map((_, c) => {
                            // Find clue starter at this index
                            const clueStarter = crosswordData?.clues.find(cl => cl.row === r && cl.col === c);
                            // Check if this cell belongs to any crossword path
                            const isActive = crosswordData?.clues.some(clue => {
                              const isAcross = clue.direction === 'across';
                              for (let i = 0; i < clue.answer.length; i++) {
                                const cr = isAcross ? clue.row : clue.row + i;
                                const cc = isAcross ? clue.col + i : clue.col;
                                if (cr === r && cc === c) return true;
                              }
                              return false;
                            });

                            if (!isActive) {
                              return <div key={`${r}-${c}`} className="w-9 h-9 md:w-11 md:h-11 bg-slate-800 rounded-md" />;
                            }

                            const val = userGrid[r]?.[c] || '';
                            const isSelected = selectedCell?.r === r && selectedCell?.c === c;

                            // Determine verification color
                            let cellBg = 'bg-white text-slate-800';
                            if (isSelected) {
                              cellBg = 'bg-blue-100 text-blue-800 border-2 border-blue-500';
                            } else if (crosswordChecked && val) {
                              // Verify if matches all overlapping words
                              const isCorrect = crosswordData.clues.every(clue => {
                                const isAcross = clue.direction === 'across';
                                for (let i = 0; i < clue.answer.length; i++) {
                                  const cr = isAcross ? clue.row : clue.row + i;
                                  const cc = isAcross ? clue.col + i : clue.col;
                                  if (cr === r && cc === c) {
                                    return val === clue.answer[i];
                                  }
                                }
                                return true;
                              });
                              cellBg = isCorrect ? 'bg-emerald-50 text-emerald-700 border-2 border-emerald-500' : 'bg-red-50 text-red-600 border-2 border-red-400';
                            }

                            return (
                              <div 
                                key={`${r}-${c}`} 
                                onClick={() => {
                                  setSelectedCell({ r, c });
                                  // Find active clue for this cell
                                  const cellClues = crosswordData.clues.filter(cl => {
                                    const isAcross = cl.direction === 'across';
                                    for (let i = 0; i < cl.answer.length; i++) {
                                      const cr = isAcross ? cl.row : cl.row + i;
                                      const cc = isAcross ? cl.col + i : cl.col;
                                      if (cr === r && cc === c) return true;
                                    }
                                    return false;
                                  });
                                  if (cellClues.length > 0) {
                                    const matchingDir = cellClues.find(cl => cl.direction === selectedDirection) || cellClues[0];
                                    setSelectedDirection(matchingDir.direction);
                                    setActiveClueText(`[${matchingDir.direction.toUpperCase()}] ${matchingDir.number}. ${matchingDir.clue}`);
                                  }
                                }}
                                className={`w-9 h-9 md:w-11 md:h-11 rounded-md relative flex items-center justify-center cursor-pointer font-bold text-sm shadow-sm select-none transition-all ${cellBg}`}
                              >
                                {clueStarter && (
                                  <span className="absolute left-0.5 top-0.5 text-[8px] font-black text-slate-400">
                                    {clueStarter.number}
                                  </span>
                                )}
                                <input 
                                  type="text" 
                                  value={val}
                                  onChange={(e) => handleCellInput(r, c, e.target.value)}
                                  className="w-full h-full bg-transparent text-center focus:outline-none uppercase font-extrabold text-sm md:text-base pointer-events-none"
                                />
                              </div>
                            );
                          })
                        ))}
                      </div>
                    </div>

                    {/* Right Clue Details List */}
                    <div className="md:col-span-5 flex flex-col gap-4">
                      
                      {/* Direction Toggler */}
                      <div className="flex bg-slate-200/60 rounded-xl p-1 shadow-inner">
                        <button 
                          onClick={() => setSelectedDirection('across')}
                          className={`flex-1 py-2 text-xs font-black rounded-lg transition-all ${
                            selectedDirection === 'across' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500'
                          }`}
                        >
                          ACROSS
                        </button>
                        <button 
                          onClick={() => setSelectedDirection('down')}
                          className={`flex-1 py-2 text-xs font-black rounded-lg transition-all ${
                            selectedDirection === 'down' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500'
                          }`}
                        >
                          DOWN
                        </button>
                      </div>

                      {/* Filtered Clues List */}
                      <div className="neuro-inset p-4 max-h-[250px] overflow-y-auto flex flex-col gap-2">
                        {crosswordData?.clues
                          .filter(cl => cl.direction === selectedDirection)
                          .map((cl) => {
                            const isCellInClue = selectedCell && (() => {
                              const isAcross = cl.direction === 'across';
                              for (let i = 0; i < cl.answer.length; i++) {
                                const cr = isAcross ? cl.row : cl.row + i;
                                const cc = isAcross ? cl.col + i : cl.col;
                                if (cr === selectedCell.r && cc === selectedCell.c) return true;
                              }
                              return false;
                            })();

                            return (
                              <div 
                                key={cl.number}
                                onClick={() => {
                                  setSelectedCell({ r: cl.row, c: cl.col });
                                  setActiveClueText(`[${cl.direction.toUpperCase()}] ${cl.number}. ${cl.clue}`);
                                }}
                                className={`p-2.5 rounded-xl cursor-pointer transition-colors border text-left ${
                                  isCellInClue 
                                    ? 'bg-blue-500/10 border-blue-500/20 text-blue-700' 
                                    : 'bg-white border-slate-100 hover:bg-slate-50 text-slate-700'
                                }`}
                              >
                                <span className="font-extrabold text-xs block mb-0.5">Clue #{cl.number}</span>
                                <p className="text-xs leading-relaxed font-semibold">{cl.clue}</p>
                              </div>
                            );
                          })}
                      </div>

                    </div>

                  </div>

                </div>
              ) : (
                // --- Grammar Multiple Choice Quiz Player ---
                <div className="flex flex-col gap-6 animate-fade-in">
                  
                  {/* Quiz Top Metadata */}
                  <div className="flex items-center justify-between border-b border-slate-300/30 pb-4">
                    <div>
                      <span className="text-[10px] font-black text-blue-600 uppercase tracking-widest block">ACTIVE TRAINING</span>
                      <h3 className="text-lg font-black text-slate-800 font-display">{quizTitle}</h3>
                    </div>
                    <span className="text-xs font-extrabold text-slate-500">
                      Question {currentQuestionIndex + 1} of {quizQuestions.length}
                    </span>
                  </div>

                  {/* Dynamic Progress indicator */}
                  <div className="bg-slate-200 h-2 rounded-full overflow-hidden">
                    <div 
                      className="bg-blue-600 h-full rounded-full transition-all duration-300"
                      style={{ width: `${((currentQuestionIndex) / quizQuestions.length) * 100}%` }}
                    />
                  </div>

                  {/* The Current Question Container */}
                  <div className="neuro-flat p-6 flex flex-col gap-6 text-left">
                    <h4 className="text-base font-black text-slate-800 leading-relaxed font-display">
                      {quizQuestions[currentQuestionIndex]?.question}
                    </h4>

                    {/* Option Selection List */}
                    <div className="flex flex-col gap-3">
                      {quizQuestions[currentQuestionIndex]?.options.map((opt, idx) => {
                        const isCorrectAnswer = idx === quizQuestions[currentQuestionIndex].answerIndex;
                        const isSelected = idx === selectedOption;

                        let style = 'bg-white hover:bg-slate-50 border-slate-100';
                        if (isAnswered) {
                          if (isCorrectAnswer) {
                            style = 'bg-emerald-50 border-emerald-500 text-emerald-800 font-extrabold';
                          } else if (isSelected) {
                            style = 'bg-red-50 border-red-400 text-red-800 font-extrabold';
                          } else {
                            style = 'opacity-60 bg-white border-slate-100';
                          }
                        }

                        return (
                          <button 
                            key={idx}
                            onClick={() => handleSelectOption(idx)}
                            disabled={isAnswered}
                            className={`p-4 rounded-xl text-left text-xs font-bold transition-all border shadow-sm flex items-center justify-between ${style}`}
                          >
                            <span>{opt}</span>
                            {isAnswered && (
                              <span>
                                {isCorrectAnswer ? <Check size={16} className="text-emerald-500" /> : isSelected ? <X size={16} className="text-red-400" /> : null}
                              </span>
                            )}
                          </button>
                        );
                      })}
                    </div>

                    {/* Explanatory Feedback Modal */}
                    {isAnswered && (
                      <div className="p-4 bg-slate-100/60 rounded-xl border border-slate-200/50 mt-4 animate-fade-in text-xs">
                        <span className="font-extrabold text-blue-600 block mb-1">Grammar Rule Tip:</span>
                        <p className="text-slate-600 leading-relaxed font-semibold">
                          {quizQuestions[currentQuestionIndex]?.explanation}
                        </p>
                        <button 
                          onClick={handleNextQuestion}
                          className="mt-4 w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-lg transition-all shadow-md text-xs uppercase"
                        >
                          Next Question
                        </button>
                      </div>
                    )}
                  </div>

                </div>
              )}
            </div>

            {/* Right Sidebar - AI Chat Tutor Panel (Universal across all levels) */}
            <div className="lg:col-span-4 flex flex-col gap-6">
              
              <div className="neuro-flat p-5 h-[550px] flex flex-col justify-between">
                
                {/* Chat Panel Header */}
                <div className="flex items-center justify-between border-b border-slate-300/30 pb-3 mb-3">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-md">
                      🤖
                    </div>
                    <div className="text-left">
                      <h4 className="text-xs font-black text-slate-800">Local AI Tutor</h4>
                      <p className="text-[10px] text-emerald-500 font-extrabold">READY & INSTANT</p>
                    </div>
                  </div>
                </div>

                {/* Messages Body Container */}
                <div className="flex-1 overflow-y-auto neuro-inset p-3 space-y-4 mb-3">
                  {chatMessages.map((m, idx) => (
                    <div 
                      key={idx}
                      className={`flex flex-col max-w-[85%] ${m.role === 'user' ? 'ml-auto items-end' : 'mr-auto items-start'}`}
                    >
                      <div className={`p-3 rounded-2xl text-xs font-semibold leading-relaxed shadow-sm ${
                        m.role === 'user' 
                          ? 'bg-blue-600 text-white rounded-tr-none' 
                          : 'bg-white text-slate-800 rounded-tl-none border border-slate-100'
                      }`}>
                        {m.text}
                      </div>
                      <span className="text-[9px] text-slate-400 mt-1 px-1 font-bold">{m.time}</span>
                    </div>
                  ))}
                  {isChatLoading && (
                    <div className="flex flex-col items-start mr-auto max-w-[80%]">
                      <div className="bg-white p-3 rounded-2xl rounded-tl-none border border-slate-100 flex items-center gap-1">
                        <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce"></span>
                        <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{ animationDelay: '0.2s' }}></span>
                        <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{ animationDelay: '0.4s' }}></span>
                      </div>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                {/* Chat Input Bar Form */}
                <form onSubmit={handleSendMessage} className="flex gap-2">
                  <input 
                    type="text" 
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Ask about grammar rules..."
                    className="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-blue-500 shadow-inner"
                  />
                  <button 
                    type="submit"
                    className="w-10 h-10 rounded-xl bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center transition-colors shadow-md"
                  >
                    <Send size={16} />
                  </button>
                </form>

              </div>

            </div>

          </main>

          {/* Dialog / Alert Popups */}
          {appAlert && appAlert.show && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-100 text-center flex flex-col items-center animate-fade-in">
                <div className={`w-14 h-14 rounded-full flex items-center justify-center mb-4 ${
                  appAlert.type === 'success' ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-blue-600'
                }`}>
                  {appAlert.type === 'success' ? <Award size={28} /> : <HelpCircle size={28} />}
                </div>
                <h3 className="text-lg font-black text-slate-800 mb-2">{appAlert.title}</h3>
                <p className="text-xs text-slate-600 leading-relaxed mb-6">{appAlert.message}</p>
                <button
                  onClick={() => setAppAlert(null)}
                  className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl text-xs transition-colors shadow-md"
                >
                  Great, got it!
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
